name: Check workflow and examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m pip install -r requirements-html.txt
      - run: npm test
      - run: npm run doctor
      - run: npm run build:learning
      - run: npm run build:examples
      - name: Audit the rendered examples at 1440 and 390px
        run: |
          status=0
          for page in docs/learning-example.html docs/*-deep-read.html; do
            node scripts/render-audit.mjs "$page" --widths 1440,390 --out "build/audit/$(basename "$page" .html)" --print || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-examples
          path: |
            docs/*.html
            build/audit/*/report.json
            build/audit/*/*.png
            build/audit/*/print.pdf
